colors: false

pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    biome-format:
      glob: "*.{js,jsx,ts,tsx}"
      run: bun run biome format --write {staged_files}
      stage_fixed: true
    biome-lint:
      glob: "{*.{js,jsx,ts,tsx},package.json}"
      run: bun run biome check --write {staged_files}
      stage_fixed: true
    typescript:
      glob: "*.{ts,tsx}"
      run: bun run tsc --project ./tsconfig.json --noEmit
      
       